<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Ícone AG Pocket: "AG" em pixel bold (traço de 2 px, cantos em degrau), branco sobre marinho. -->
  <rect width="16" height="16" fill="#051733"/>
  <g fill="#FFFFFF">
    <!-- A -->
    <rect x="2" y="4" width="4" height="1"/>
    <rect x="1" y="5" width="6" height="1"/>
    <rect x="1" y="6" width="2" height="2"/>
    <rect x="5" y="6" width="2" height="2"/>
    <rect x="1" y="8" width="6" height="1"/>
    <rect x="1" y="9" width="2" height="3"/>
    <rect x="5" y="9" width="2" height="3"/>
    <!-- G -->
    <rect x="10" y="4" width="4" height="1"/>
    <rect x="9" y="5" width="6" height="1"/>
    <rect x="9" y="6" width="2" height="4"/>
    <rect x="12" y="8" width="3" height="1"/>
    <rect x="13" y="9" width="2" height="1"/>
    <rect x="9" y="10" width="6" height="1"/>
    <rect x="10" y="11" width="5" height="1"/>
  </g>
</svg>
